<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabeza('ElMandado - Detalle de Pedido')}"></head>
<body>

<div class="container">
    <div th:replace="~{fragmentos/comunes :: menu('lista')}"></div>

    <h2>Detalle del Pedido #<span th:text="${pedido.id}">1</span></h2>

    <div class="card">
        <p><strong>Identificador (ID):</strong> <span th:text="${pedido.id}">1</span></p>
        <p><strong>Nombre del Cliente:</strong> <span th:text="${pedido.cliente}">Carlos Mendoza</span></p>
        <p><strong>Plato / Orden:</strong> <span th:text="${pedido.plato}">Pizza Pepperoni</span></p>
        <p><strong>Precio Total:</strong> <span th:text="${'$' + #numbers.formatDecimal(pedido.precio, 1, 2)}">$12.50</span></p>
        <p><strong>Estado de Entrega:</strong> 
            <span th:if="${pedido.entregado}" class="badge badge-success">✓ Entregado</span>
            <span th:unless="${pedido.entregado}" class="badge badge-warning">⏳ Pendiente de Entrega</span>
        </p>
    </div>

    <p style="margin-top: 20px;">
        <a th:unless="${pedido.entregado}" 
           th:href="@{/pedidos/{id}/entregar(id=${pedido.id})}" 
           class="btn btn-primary">Marcar como Entregado</a>
        
        <a th:href="@{/pedidos}" class="btn btn-secondary">Volver al Listado</a>
    </p>

    <div th:replace="~{fragmentos/comunes :: pie}"></div>
</div>

</body>
</html>
