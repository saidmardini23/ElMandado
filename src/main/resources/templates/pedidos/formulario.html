<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabeza('ElMandado - Nuevo Pedido')}"></head>
<body>

<div class="container">
    <div th:replace="~{fragmentos/comunes :: menu('nuevo')}"></div>

    <h2>Registrar Nuevo Pedido</h2>

    <div class="card">
        <form th:action="@{/pedidos}" th:object="${pedido}" method="post">
            
            <div class="form-group">
                <label for="cliente">Nombre del Cliente:</label>
                <input type="text" id="cliente" th:field="*{cliente}" class="form-control" required placeholder="Ej. Carlos Mendoza" />
            </div>

            <div class="form-group">
                <label for="plato">Plato / Orden:</label>
                <input type="text" id="plato" th:field="*{plato}" class="form-control" required placeholder="Ej. Pizza Pepperoni" />
            </div>

            <div class="form-group">
                <label for="precio">Precio ($):</label>
                <input type="number" id="precio" step="0.01" th:field="*{precio}" class="form-control" required placeholder="0.00" />
            </div>

            <p style="margin-top: 20px;">
                <button type="submit" class="btn btn-primary">Guardar Pedido</button>
                <a th:href="@{/pedidos}" class="btn btn-secondary" style="margin-left: 10px;">Cancelar</a>
            </p>

        </form>
    </div>

    <div th:replace="~{fragmentos/comunes :: pie}"></div>
</div>

</body>
</html>
